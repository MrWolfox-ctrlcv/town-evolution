name: Actual Cocos browser preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/**', 'scripts/preview/**', '.github/workflows/preview.yml']
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      COCOS_ENGINE: ${{ github.workspace }}/temp/cocos-engine
      COCOS_CLI: ${{ github.workspace }}/temp/cocos-cli
      PREVIEW_OUT: ${{ github.workspace }}/build/preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned official Cocos 3.8.8 engine
        run: |
          git clone --depth 1 --branch v3.8.8 https://github.com/cocos/cocos-engine.git "$COCOS_ENGINE"
          test "$(git -C "$COCOS_ENGINE" rev-parse HEAD)" = 411f98df047c25902f93440d4b22925c2fb65461
      - name: Fetch pinned official effect compiler
        run: |
          git clone https://github.com/cocos/cocos-cli.git "$COCOS_CLI"
          git -C "$COCOS_CLI" checkout 723a5b6eb76cd9a1e740566bbbb62ae32ae081ef
      - name: Install isolated build tools
        run: |
          cd "$COCOS_ENGINE"
          # Upstream lock contains unavailable npmmirror binary artifact URLs.
          mv package-lock.json package-lock.upstream.json
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm install --no-save --ignore-scripts --no-audit --no-fund esbuild@0.28.2 systemjs@6.15.1 playwright@1.56.1 pngjs@7.0.0 glsl-tokenizer@2.1.5 glsl-parser@2.0.1 js-yaml@4.1.0 jsdom@26.1.0
          npx playwright install --with-deps chromium
      - name: Install Chinese UI fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libegl1-mesa libgles2-mesa
      - name: Install project build dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate effects for this runner with real Mesa
        run: npm run preview:effects:generate -- --mesa
      - name: Record runner-specific effect source without changing the remote branch
        run: |
          mkdir -p build/ci-derived-source
          git rev-parse HEAD > build/ci-derived-source/upstream-commit.txt
          test "$(git diff --name-only)" = "scripts/preview/generated/effects.cache.json"
          test -z "$(git diff --cached --name-only)"
          git diff --binary -- scripts/preview/generated/effects.cache.json > build/ci-derived-source/effect-cache.patch
          cp scripts/preview/generated/effects.cache.json build/ci-derived-source/effects.cache.json
          git add -- scripts/preview/generated/effects.cache.json
          git -c user.name='Town Evolution CI' -c user.email='town-evolution-ci@users.noreply.github.com' commit -m 'build: record runner-specific compiled effect cache'
          git rev-parse HEAD > build/ci-derived-source/derived-commit.txt
      - name: Build actual engine and project scripts
        run: node scripts/preview/build.cjs
      - name: Verify actual compiled tween scheduling
        run: node scripts/preview/tween-smoke.cjs
      - name: Prepare domain fixtures for browser interaction checks
        run: npm run build:domain
      - name: Render actual game at desktop and mobile sizes
        run: node scripts/preview/capture.cjs
      - name: Preserve screenshots and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-runtime-evidence
          path: |
            build/screenshots
            build/tween-smoke.json
            build/ci-derived-source
          if-no-files-found: warn
      - name: Preserve standalone preview with license notices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-standalone-preview
          path: build/preview
          if-no-files-found: warn
